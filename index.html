<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supun AI Chatbot</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .typing-dot {
            animation: pulse-slow 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-dvh flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Top Header Bar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur px-4 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/20">
                ⚡
            </div>
            <div>
                <h1 class="font-semibold text-sm sm:text-base tracking-wide">Supun AI</h1>
                <p class="text-xs text-emerald-400 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 
                    Connected to Vercel API
                </p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="clearChat()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition border border-slate-700/50">
                Clear Chat
            </button>
        </div>
    </header>

    <!-- Main Chat Feed Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 max-w-3xl w-full mx-auto">
        <!-- Welcome Greeting Bubble -->
        <div class="flex items-start space-x-3">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-xs shrink-0 shadow">
                🤖
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl rounded-tl-none p-3.5 sm:p-4 max-w-[85%] sm:max-w-md shadow-md text-sm leading-relaxed">
                <p>Hello! I am Supun AI, your Groq-powered assistant running live on your FastAPI backend. How can I help you today?</p>
            </div>
        </div>
    </main>

    <!-- Quick Prompt Suggestion Chips -->
    <div class="max-w-3xl w-full mx-auto px-4 pb-2">
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-1 text-xs">
            <button onclick="sendQuickPrompt('Explain quantum computing in 2 sentences')" class="whitespace-nowrap bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-full transition">
                🌌 Quantum computing
            </button>
            <button onclick="sendQuickPrompt('Write a python script to reverse a string')" class="whitespace-nowrap bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-full transition">
                🐍 Python string reverse
            </button>
            <button onclick="sendQuickPrompt('Give me a fun productivity tip')" class="whitespace-nowrap bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-full transition">
                💡 Productivity tip
            </button>
        </div>
    </div>

    <!-- Input Form Footer -->
    <footer class="border-t border-slate-800 bg-slate-900/90 backdrop-blur p-3 sm:p-4 shrink-0">
        <form id="chat-form" onsubmit="handleSendMessage(event)" class="max-w-3xl mx-auto flex items-center gap-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Ask Supun AI something..." 
                autocomplete="off"
                class="flex-1 bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-3 text-sm outline-none transition text-slate-100 placeholder-slate-500 shadow-inner"
            >
            <button 
                type="submit" 
                id="send-button"
                class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-5 py-3 rounded-xl font-medium text-sm transition shadow-lg shadow-indigo-600/30 flex items-center justify-center shrink-0"
            >
                Send
            </button>
        </form>
    </footer>

    <!-- Frontend Script Logic -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center text-xs shrink-0 shadow ${isUser ? 'bg-indigo-600' : 'bg-gradient-to-tr from-indigo-600 to-violet-600'}`;
            avatar.textContent = isUser ? '👤' : '🤖';

            const bubble = document.createElement('div');
            bubble.className = `p-3.5 sm:p-4 max-w-[85%] sm:max-w-md shadow-md text-sm leading-relaxed rounded-2xl ${
                isUser 
                    ? 'bg-indigo-600 text-white rounded-tr-none' 
                    : 'bg-slate-900 border border-slate-800 text-slate-100 rounded-tl-none'
            }`;
            
            bubble.innerHTML = `<p class="whitespace-pre-wrap">${escapeHtml(text)}</p>`;

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const wrapper = document.createElement('div');
            wrapper.id = 'typing-indicator';
            wrapper.className = 'flex items-start space-x-3';

            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-xs shrink-0 shadow">🤖</div>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl rounded-tl-none p-4 shadow-md flex items-center space-x-1.5 h-10">
                    <div class="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }

        function sendQuickPrompt(text) {
            userInput.value = text;
            handleSendMessage(new Event('submit'));
        }

        async function handleSendMessage(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            userInput.disabled = true;
            sendButton.disabled = true;

            appendMessage('user', text);
            showTypingIndicator();

            try {
                const encodedMessage = encodeURIComponent(text);
                const response = await fetch(`/chat/${encodedMessage}`);

                removeTypingIndicator();

                if (!response.ok) {
                    throw new Error(`Server responded with status ${response.status}`);
                }

                const data = await response.json();
                const aiReply = data.ai_response || data.response || JSON.stringify(data);
                appendMessage('ai', aiReply);

            } catch (error) {
                removeTypingIndicator();
                appendMessage('ai', '⚠️ Error connecting to Supun AI backend. Please check your Vercel deployment status.');
                console.error(error);
            } finally {
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        function clearChat() {
            chatContainer.innerHTML = `
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-xs shrink-0 shadow">🤖</div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl rounded-tl-none p-3.5 sm:p-4 max-w-[85%] sm:max-w-md shadow-md text-sm leading-relaxed">
                        <p>Chat history cleared. What else can Supun AI help you with?</p>
                    </div>
                </div>
            `;
        }

        function escapeHtml(string) {
            return string
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
